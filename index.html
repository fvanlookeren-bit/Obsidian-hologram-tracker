<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Topologies of Thought — your Obsidian memory</title>
<meta http-equiv="Cache-Control" content="no-store" />
<script>
  document.write('<link rel="stylesheet" href="style.css?t=' + Date.now() + '">');
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"
  }
}
</script>
</head>
<body>
  <video id="cam" autoplay playsinline muted></video>
  <div id="vignette"></div>
  <canvas id="scene"></canvas>
  <div id="labels"></div>
  <div id="reticle"></div>
  <div id="pinchReadout"></div>
  <div id="pinchReadout2"></div>
  <div id="frame"></div>

  <div id="help" class="hud">
    <kbd>pinch</kbd> move/select · <kbd>fist</kbd> supernova · <kbd>open hand</kbd> expand<br />
    <kbd>D</kbd> labels · <kbd>F</kbd> face · <kbd>H</kbd> hands · <kbd>R</kbd> rotate · <kbd>0</kbd> recenter
  </div>

  <div id="title" class="hud">
    <h1>Topologies of Thought</h1>
    <div class="sub">a living map of your Obsidian vault</div>
    <div class="mode" id="modeLabel">mode: distributed</div>
  </div>

  <div id="stats" class="hud">
    <div><b id="sNodes">—</b> notes · <b id="sLinks">—</b> connections</div>
    <div id="sHover" style="min-height:1.2em"></div>
    <div style="color:#6f8492" id="sFps"></div>
  </div>

  <div id="legend" class="hud"></div>

  <div id="status">Loading the shape of your thoughts…</div>

  <script>
    // cache-bust: carga SIEMPRE la última app.js (imposible ver versión vieja)
    (function () {
      var s = document.createElement('script');
      s.type = 'module';
      s.src = 'app.js?t=' + Date.now();
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
